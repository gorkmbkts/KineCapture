[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinecapture"
version = "0.11.0"
description = "KineCapture Studio - ZED 2i motion capture, review, labelling and dataset export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "opencv-python>=4.8",
]

# NOTE: `pyzed` is intentionally NOT a dependency here.
# The ZED Python binding ships with the Stereolabs ZED SDK installer and is
# installed separately into the environment. See README.md.

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
kinecapture = "kinecapture.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The navigation rail's university logo is a package resource, not a file next
# to the checkout: an installed application has no repository to look in.
[tool.setuptools.package-data]
"kinecapture.gui.assets" = ["*.png"]
# The shipped default configuration. Package data, not a file next to the
# checkout, for the same reason as the logo above.
"kinecapture.resources" = ["*.yaml"]
"kinecapture.preview.vendor" = ["LICENSE", "NOTICE.md"]
# Design tokens are data, not code: one file generates the Qt stylesheet today
# and can generate a WinUI ResourceDictionary later.
"kinecapture.studio.theme" = ["tokens.json", "studio.qss.tmpl"]
# Lucide icons, ISC licensed, shipped verbatim with their licence text.
"kinecapture.studio.views.icons" = ["*.svg", "LICENSE.lucide.txt"]
# Space Grotesk, SIL Open Font License 1.1, shipped verbatim with OFL.txt.
# Bundled rather than fetched: the sign-in screen must not need a network.
"kinecapture.studio.views.fonts" = ["*.ttf", "OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # Launches a real child process and waits for it. Kept marked so a quick
    # run can skip them with -m 'not slow', not so they can be forgotten.
    "slow: starts a child process and waits for it to finish",
]
filterwarnings = ["error::DeprecationWarning:kinecapture.*"]
