[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinecapture"
version = "0.4.0"
description = "KineCapture Studio - ZED 2i motion capture, review, labelling and dataset export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "opencv-python>=4.8",
]

# NOTE: `pyzed` is intentionally NOT a dependency here.
# The ZED Python binding ships with the Stereolabs ZED SDK installer and is
# installed separately into the environment. See README.md.

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
kinecapture = "kinecapture.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:kinecapture.*"]
